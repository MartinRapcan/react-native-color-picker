pre-commit:
  parallel: true
  commands:

    types:
      glob: "*.{js,ts,jsx,tsx}"
      run: bun run typecheck
    lint:
      glob: "src/**/*.{ts,tsx}"
      run: bunx oxlint --deny-warnings {staged_files}
    format:
      glob: "src/**/*.{ts,tsx}"
      run: bunx oxfmt --check {staged_files}
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: bun x commitlint --edit
